<!DOCTYPE html>
<html>
<head>
<title>Memory Match Deluxe</title>

<style>

body{
background:linear-gradient(135deg,#6dd5fa,#2980b9);
font-family:Arial;
text-align:center;
color:white;
}

button{
padding:8px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin:5px;
background:#ffd700;
}

#game{
margin:auto;
margin-top:20px;
display:grid;
gap:10px;
justify-content:center;
}

.card{
width:80px;
height:80px;
background:#222;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
cursor:pointer;
color:transparent;
transition:transform 0.4s, background 0.3s;
box-shadow:0 5px 12px rgba(0,0,0,0.4);
}

.card:hover{
transform:scale(1.1);
}

.card.flipped{
background:white;
color:black;
transform:rotateY(180deg);
}

.card.matched{
background:#7CFC00;
color:black;
animation:glow 0.6s ease;
}

@keyframes glow{
0%{transform:scale(1)}
50%{transform:scale(1.25)}
100%{transform:scale(1)}
}

#win{
display:none;
font-size:28px;
margin-top:20px;
animation:pop 0.8s ease;
}

@keyframes pop{
0%{transform:scale(0)}
80%{transform:scale(1.2)}
100%{transform:scale(1)}
}

</style>
</head>

<body>

<h1>🧠 Memory Match</h1>

<p>
<button onclick="startGame(4)">Easy</button>
<button onclick="startGame(6)">Medium</button>
<button onclick="startGame(8)">Hard</button>
</p>

<p>
Moves: <span id="moves">0</span> |
Time: <span id="time">0</span>s
</p>

<div id="game"></div>

<div id="win">🎉 You Win! 🎉</div>

<script>

let emojis=[
"🐉","🧙","👑","⚔️","🧝","🪄","🐺","🛡️",
"🦄","🔥","❄️","🌙","⭐","🍀","💎","👻"
]

let first=null
let second=null
let lock=false
let moves=0
let matches=0
let pairs=0
let timer=0
let interval

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
let temp=arr[i]
arr[i]=arr[j]
arr[j]=temp
}
}

function startGame(size){

let game=document.getElementById("game")
game.innerHTML=""

document.getElementById("win").style.display="none"

game.style.gridTemplateColumns="repeat("+size+",80px)"

moves=0
matches=0
timer=0

document.getElementById("moves").innerText=moves
document.getElementById("time").innerText=timer

clearInterval(interval)

pairs=(size*size)/2

let chosen=emojis.slice(0,pairs)
let cards=chosen.concat(chosen)

shuffle(cards)

cards.forEach(function(symbol){

let card=document.createElement("div")
card.className="card"
card.dataset.symbol=symbol
card.innerText=symbol

card.onclick=function(){
flipCard(card)
}

game.appendChild(card)

})

interval=setInterval(function(){
timer++
document.getElementById("time").innerText=timer
},1000)

}

function flipCard(card){

if(lock || card.classList.contains("flipped") || card.classList.contains("matched")) return

card.classList.add("flipped")

if(!first){
first=card
return
}

second=card
moves++
document.getElementById("moves").innerText=moves

if(first.dataset.symbol===second.dataset.symbol){

first.classList.add("matched")
second.classList.add("matched")

matches++

first=null
second=null

if(matches===pairs){
winGame()
}

}else{

lock=true

setTimeout(function(){

first.classList.remove("flipped")
second.classList.remove("flipped")

first=null
second=null
lock=false

},800)

}

}

function winGame(){

clearInterval(interval)

document.getElementById("win").style.display="block"

}

startGame(4)

</script>

</body>
</html>
